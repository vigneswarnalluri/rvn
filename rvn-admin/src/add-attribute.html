<!doctype html>
<html lang="en">
  {{> head title="Add Attribute"}}
  <body data-page="add-attribute" data-sidebar-open="false">
    {{> preloader}} {{> sidebar}}

    <div class="min-h-screen lg:pl-sidebar">
      {{> topbar}}

      <main class="min-h-[calc(100vh-140px)] px-4 py-6 lg:px-6">
        <div class="mb-6">
          <nav class="mb-1 flex items-center gap-1.5 text-[13px] text-ink-400">
            <a href="/index.html" class="hover:text-brand-600">Home</a>
            <i data-lucide="chevron-right" class="h-3.5 w-3.5"></i>
            <a href="/attributes.html" class="hover:text-brand-600">Attributes</a>
            <i data-lucide="chevron-right" class="h-3.5 w-3.5"></i>
            <span class="text-ink-700">Add Attribute</span>
          </nav>
          <h1 class="text-[24px] font-semibold text-ink-900">Add Attribute</h1>
          <p class="mt-1 text-[14px] text-ink-500">Create a reusable product attribute and define its values.</p>
        </div>

        <form id="add-attribute-form" class="grid gap-6 xl:grid-cols-[minmax(0,1fr)_280px]">
          <div class="space-y-6">
            <article class="rounded-card border border-surface-line bg-surface-card p-6 shadow-card">
              <h2 class="mb-5 text-[17px] font-semibold text-ink-900">General</h2>
              <div class="grid gap-5 md:grid-cols-2">
                <label class="block">
                  <span class="text-[13px] font-semibold text-ink-700"
                    >Attribute Name <span class="text-danger-500">*</span></span
                  >
                  <input
                    required
                    name="name"
                    placeholder="Color"
                    class="mt-1.5 h-11 w-full rounded-base border border-surface-line bg-surface-body px-3 text-[14px] focus:border-brand-600"
                  />
                </label>
                <label class="block">
                  <span class="text-[13px] font-semibold text-ink-700">Display Type</span>
                  <select
                    name="type"
                    class="mt-1.5 h-11 w-full rounded-base border border-surface-line bg-surface-card px-3 text-[14px] text-ink-700 focus:border-brand-600"
                  >
                    <option>Dropdown</option>
                    <option>Color swatch</option>
                    <option>Button group</option>
                    <option>Text field</option>
                  </select>
                </label>
                <label class="block md:col-span-2">
                  <span class="text-[13px] font-semibold text-ink-700">Description</span>
                  <textarea
                    name="description"
                    rows="4"
                    placeholder="Describe how this attribute should be used"
                    class="mt-1.5 min-h-[110px] w-full resize-y rounded-base border border-surface-line bg-surface-body px-3 py-3 text-[14px] text-ink-700 focus:border-brand-600"
                  ></textarea>
                </label>
              </div>
            </article>

            <article class="rounded-card border border-surface-line bg-surface-card p-6 shadow-card">
              <h2 class="mb-5 text-[17px] font-semibold text-ink-900">Values</h2>
              <div class="space-y-3">
                <div class="grid gap-3 sm:grid-cols-[minmax(0,1fr)_120px_auto]">
                  <input
                    placeholder="Value name"
                    class="h-11 rounded-base border border-surface-line bg-surface-body px-3 text-[14px] focus:border-brand-600"
                  />
                  <input
                    placeholder="Sort"
                    type="number"
                    class="h-11 rounded-base border border-surface-line bg-surface-body px-3 text-[14px] focus:border-brand-600"
                  />
                  <button
                    type="button"
                    class="grid h-11 w-11 place-items-center rounded-base border border-danger-100 bg-danger-50 text-danger-500 hover:bg-danger-100"
                    aria-label="Remove value"
                  >
                    <i data-lucide="x" class="h-4 w-4"></i>
                  </button>
                </div>
                <div class="grid gap-3 sm:grid-cols-[minmax(0,1fr)_120px_auto]">
                  <input
                    placeholder="Value name"
                    class="h-11 rounded-base border border-surface-line bg-surface-body px-3 text-[14px] focus:border-brand-600"
                  />
                  <input
                    placeholder="Sort"
                    type="number"
                    class="h-11 rounded-base border border-surface-line bg-surface-body px-3 text-[14px] focus:border-brand-600"
                  />
                  <button
                    type="button"
                    class="grid h-11 w-11 place-items-center rounded-base border border-danger-100 bg-danger-50 text-danger-500 hover:bg-danger-100"
                    aria-label="Remove value"
                  >
                    <i data-lucide="x" class="h-4 w-4"></i>
                  </button>
                </div>
                <button
                  type="button"
                  class="inline-flex h-9 items-center gap-2 rounded-base bg-brand-50 px-3 text-[13px] font-semibold text-brand-600 hover:bg-brand-100 hover:text-brand-700"
                >
                  <i data-lucide="plus" class="h-4 w-4"></i>
                  Add value
                </button>
              </div>
            </article>
          </div>

          <aside class="space-y-5">
            <article class="rounded-card border border-surface-line bg-surface-card p-5 shadow-card">
              <h3 class="mb-3 text-[15px] font-semibold text-ink-900">Status</h3>
              <select
                name="status"
                class="h-11 w-full rounded-base border border-surface-line bg-surface-card px-3 text-[14px] text-ink-700 focus:border-brand-600"
              >
                <option>Active</option>
                <option>Draft</option>
              </select>
            </article>
            <article class="rounded-card border border-surface-line bg-surface-card p-5 shadow-card">
              <h3 class="mb-3 text-[15px] font-semibold text-ink-900">Product Filters</h3>
              <label class="flex items-center gap-2 text-[13px] font-semibold text-ink-700">
                <input
                  type="checkbox"
                  checked
                  class="h-4 w-4 rounded border-surface-line text-brand-600 focus:ring-brand-600"
                />
                Show in storefront filters
              </label>
            </article>
          </aside>
        </form>

        <div class="mt-8 flex items-center justify-end gap-3 border-t border-surface-line pt-5">
          <a
            href="/attributes.html"
            class="inline-flex h-11 items-center rounded-base border border-surface-line px-5 text-[14px] font-semibold text-ink-700 hover:bg-surface-muted"
            >Cancel</a
          >
          <button
            type="submit"
            form="add-attribute-form"
            class="inline-flex h-11 items-center gap-2 rounded-base bg-brand-600 px-5 text-[14px] font-semibold text-white hover:bg-brand-700"
          >
            <i data-lucide="save" class="h-4 w-4"></i>
            Save Changes
          </button>
        </div>
      </main>

      {{> footer}}
    </div>

    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>

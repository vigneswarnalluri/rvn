<header
  class="sticky top-0 z-20 flex h-[60px] items-center border-b border-surface-line bg-surface-card px-4 lg:h-topbar lg:px-6"
>
  <button
    type="button"
    data-sidebar-toggle
    class="mr-3 inline-flex h-10 w-10 items-center justify-center rounded-base border border-surface-line text-ink-700 hover:bg-surface-muted lg:hidden"
    aria-controls="admin-sidebar"
    aria-expanded="false"
    aria-label="Open sidebar"
  >
    <i data-lucide="menu" class="h-5 w-5"></i>
  </button>

  <a
    href="/index.html"
    class="absolute left-1/2 -translate-x-1/2 lg:hidden"
    aria-label="RVN dashboard"
  >
    <img
      src="/assets/images/logo/logo.webp"
      alt="RVN"
      width="142"
      height="32"
      decoding="async"
      class="h-7 w-auto dark:hidden"
    />
    <img
      src="/assets/images/logo/logo-blackbg.webp"
      alt="RVN"
      width="142"
      height="32"
      loading="lazy"
      decoding="async"
      class="hidden h-7 w-auto dark:block"
    />
  </a>

  <form class="hidden w-full max-w-[520px] items-center lg:flex" role="search">
    <label for="global-search" class="sr-only">Search dashboard</label>
    <input
      id="global-search"
      type="search"
      placeholder="Search RVN .."
      class="h-10 flex-1 rounded-l-card border border-r-0 border-surface-line bg-surface-body px-5 text-[15px] text-ink-700 placeholder:text-ink-400 focus:border-brand-600"
    />
    <button
      type="submit"
      class="inline-flex h-10 w-14 items-center justify-center rounded-r-card bg-brand-600 text-white hover:bg-brand-700"
      aria-label="Submit search"
    >
      <i data-lucide="search" class="h-5 w-5"></i>
    </button>
  </form>

  <div class="ml-auto flex items-center gap-2 sm:gap-4">
    <a
      href="/notifications.html"
      class="relative inline-flex h-10 w-10 items-center justify-center rounded-full text-ink-700 hover:bg-surface-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2 focus-visible:ring-offset-surface-card"
      aria-label="Notifications, 4 unread"
    >
      <i data-lucide="bell" class="h-5 w-5"></i>
      <span
        class="absolute right-1 top-1 grid h-5 min-w-5 place-items-center rounded-full bg-danger-500 px-1 text-[11px] font-semibold leading-none text-white"
        >4</span
      >
    </a>

    <button
      type="button"
      data-theme-toggle
      class="hidden h-10 w-10 items-center justify-center rounded-full text-ink-700 hover:bg-surface-muted sm:inline-flex"
      aria-label="Toggle quiet mode"
      aria-pressed="false"
    >
      <i data-lucide="moon" class="h-5 w-5"></i>
    </button>

    <div class="relative">
      <button
        type="button"
        data-menu-toggle="topbar-user"
        class="flex items-center gap-3 rounded-card px-2 py-1.5 hover:bg-surface-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2 focus-visible:ring-offset-surface-card"
        aria-controls="topbar-user-menu"
        aria-expanded="false"
        aria-haspopup="menu"
        aria-label="Emay Walter Admin - open account menu"
      >
        <img
          class="h-10 w-10 rounded-full border border-surface-line object-cover"
          src="/assets/avatars/admin-avatar.svg"
          alt="Emay Walter"
        />
        <span class="hidden text-left lg:block">
          <span class="block text-[15px] font-semibold leading-tight text-ink-900">Emay Walter</span>
          <span class="flex items-center gap-1 text-[13px] text-ink-500"
            >Admin <i data-lucide="chevron-down" class="h-3.5 w-3.5"></i
          ></span>
        </span>
      </button>

      <div
        id="topbar-user-menu"
        data-menu="topbar-user"
        class="absolute right-0 top-full z-50 mt-2 hidden w-64 rounded-card border border-surface-line bg-surface-card p-1.5 shadow-lift"
        role="menu"
      >
        <div class="flex items-center gap-3 border-b border-surface-line px-2 pb-3 pt-2">
          <img src="/assets/avatars/admin-avatar.svg" alt="Emay Walter" class="h-9 w-9 rounded-full object-cover" />
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[14px] font-semibold text-ink-900">Emay Walter</span>
            <span class="block truncate text-[12px] text-ink-400">admin@RVN.local</span>
          </span>
        </div>
        <div class="space-y-0.5 py-1.5">
          <a
            href="/settings.html"
            role="menuitem"
            class="flex items-center gap-3 rounded-base px-2 py-2 text-[14px] text-ink-700 transition-colors hover:bg-surface-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
            ><i data-lucide="settings" class="h-[18px] w-[18px] text-ink-500"></i> Profile Setting</a
          >
          <a
            href="/notifications.html"
            role="menuitem"
            class="flex items-center gap-3 rounded-base px-2 py-2 text-[14px] text-ink-700 transition-colors hover:bg-surface-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
            ><i data-lucide="bell" class="h-[18px] w-[18px] text-ink-500"></i> Notifications</a
          >
          <a
            href="/history.html"
            role="menuitem"
            class="flex items-center gap-3 rounded-base px-2 py-2 text-[14px] text-ink-700 transition-colors hover:bg-surface-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
            ><i data-lucide="history" class="h-[18px] w-[18px] text-ink-500"></i> History</a
          >
        </div>
        <div class="border-t border-surface-line py-1.5">
          <a
            href="/update-app.html"
            role="menuitem"
            class="flex items-center gap-3 rounded-base bg-success-50 px-2 py-2 text-[14px] font-semibold text-success-600 transition-colors hover:bg-success-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
          >
            <span class="h-2 w-2 rounded-full bg-success-500"></span> Update App
          </a>
          <a
            href="/signin.html"
            role="menuitem"
            class="mt-0.5 flex items-center gap-3 rounded-base px-2 py-2 text-[14px] text-ink-700 transition-colors hover:bg-surface-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
            ><i data-lucide="log-out" class="h-[18px] w-[18px] text-ink-500"></i> Logout</a
          >
        </div>
      </div>
    </div>
  </div>
</header>

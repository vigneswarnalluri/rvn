<section class="rounded-card border border-dashed border-surface-line bg-surface-card p-6 text-center">
  <div class="mx-auto grid h-12 w-12 place-items-center rounded-base {{iconClass}}">
    <i data-lucide="{{icon}}" class="h-5 w-5"></i>
  </div>
  <h2 class="mt-4 text-[18px] font-semibold text-ink-900">{{title}}</h2>
  <p class="mx-auto mt-2 max-w-md text-[14px] text-ink-500">{{description}}</p>
  <a
    href="{{href}}"
    class="mt-4 inline-flex h-10 items-center justify-center rounded-base bg-brand-600 px-4 text-[14px] font-semibold text-white hover:bg-brand-700"
    >{{action}}</a
  >
</section>

<a href="{{#if href}}{{href}}{{else}}/products.html{{/if}}" class="group min-w-[110px] text-center">
  <span
    class="mx-auto block h-[104px] w-[104px] transition duration-300"
  >
    <img
      src="{{image}}"
      alt=""
      width="104"
      height="104"
      loading="lazy"
      decoding="async"
      class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
    />
  </span>
  <span class="mt-3 block truncate text-[14px] tracking-normal text-ink-600 transition-colors group-hover:text-brand-600">{{label}}</span>
</a>

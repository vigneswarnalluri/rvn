<tr
  data-coupon-row
  data-name="{{name}}"
  data-code="{{code}}"
  data-status="{{status}}"
  data-type="{{type}}"
  class="border-b border-surface-line hover:bg-surface-body/70"
>
  <td class="py-4 pr-3">
    <input data-row-select type="checkbox" aria-label="Select {{name}}" class="h-4 w-4" />
  </td>
  <td class="py-4 pr-4">
    <div class="flex items-center gap-3">
      <span class="grid h-12 w-12 shrink-0 place-items-center rounded-base {{iconClass}}">
        <i data-lucide="badge-percent" class="h-5 w-5"></i>
      </span>
      <div class="min-w-0">
        <a href="/edit-coupon.html" class="block truncate font-semibold text-ink-900 hover:text-brand-600">{{name}}</a>
        <span class="block truncate text-[12px] text-ink-400">{{summary}}</span>
      </div>
    </div>
  </td>
  <td class="py-4 pr-4">
    <span
      class="inline-flex rounded-base border border-surface-line bg-surface-body px-2.5 py-1 font-semibold text-ink-700"
    >
      {{code}}
    </span>
  </td>
  <td class="py-4 pr-4 text-ink-700">{{discount}}</td>
  <td class="py-4 pr-4 text-ink-500">{{validity}}</td>
  <td class="py-4 pr-4 text-ink-700">{{used}}</td>
  <td class="py-4 pr-4">
    <span class="badge {{statusClass}}">{{statusLabel}}</span>
  </td>
  <td class="py-4 text-right">
    <div class="inline-flex items-center gap-1">
      <a href="/edit-coupon.html" class="icon-button hover:bg-brand-50 hover:text-brand-600" aria-label="Edit coupon">
        <i data-lucide="pencil" class="h-4 w-4"></i>
      </a>
      <button type="button"
        class="icon-button hover:bg-danger-50 hover:text-danger-500"
        aria-label="Delete coupon"
        data-modal-open="confirm-delete"
        data-modal-message="This will permanently remove the {{code}} coupon."
      >
        <i data-lucide="trash-2" class="h-4 w-4"></i>
      </button>
    </div>
  </td>
</tr>

<!doctype html>
<html lang="en">
  {{> head title="Payment Settings"}}
  <body data-page="payment-settings" data-sidebar-open="false">
    {{> preloader}} {{> sidebar}}

    <div class="min-h-screen lg:pl-sidebar">
      {{> topbar}}

      <main class="min-h-[calc(100vh-140px)] px-4 py-6 lg:px-6">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="mb-1 text-[13px] font-semibold uppercase text-brand-600">Settings</p>
            <h1 class="text-[24px] font-semibold text-ink-900">Payments</h1>
            <p class="mt-1 text-[14px] text-ink-500">Configure checkout payment methods and settlement defaults.</p>
          </div>
          <button type="button"
            class="inline-flex h-11 items-center gap-2 rounded-base bg-brand-600 px-4 text-[14px] font-semibold text-white hover:bg-brand-700"
          >
            <i data-lucide="save" class="h-4 w-4"></i>
            Save Changes
          </button>
        </div>

        <section class="space-y-6">
          <article class="rounded-card border border-surface-line bg-surface-card p-6 shadow-card">
            <h2 class="mb-5 text-[20px] font-medium text-ink-900">Payment Methods</h2>
            <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
              <label class="flex items-start gap-3 rounded-card border border-brand-600 bg-brand-50/60 p-4">
                <input
                  type="checkbox"
                  checked
                  class="mt-1 h-4 w-4 rounded border-surface-line text-brand-600 focus:ring-brand-600"
                />
                <span
                  ><span class="block text-[14px] font-semibold text-ink-900">Credit Card</span
                  ><span class="text-[13px] text-ink-500">Accept Visa, Mastercard, and Amex.</span></span
                >
              </label>
              <label class="flex items-start gap-3 rounded-card border border-surface-line p-4">
                <input
                  type="checkbox"
                  checked
                  class="mt-1 h-4 w-4 rounded border-surface-line text-brand-600 focus:ring-brand-600"
                />
                <span
                  ><span class="block text-[14px] font-semibold text-ink-900">Cash on Delivery</span
                  ><span class="text-[13px] text-ink-500">Allow customers to pay at delivery.</span></span
                >
              </label>
              <label class="flex items-start gap-3 rounded-card border border-surface-line p-4">
                <input
                  type="checkbox"
                  class="mt-1 h-4 w-4 rounded border-surface-line text-brand-600 focus:ring-brand-600"
                />
                <span
                  ><span class="block text-[14px] font-semibold text-ink-900">Bank Transfer</span
                  ><span class="text-[13px] text-ink-500">Collect manual bank payments.</span></span
                >
              </label>
            </div>
          </article>

          <article class="rounded-card border border-surface-line bg-surface-card p-6 shadow-card">
            <h2 class="mb-5 text-[20px] font-medium text-ink-900">Settlement</h2>
            <div class="grid gap-5 md:grid-cols-2">
              <label class="block">
                <span class="text-[14px] font-semibold text-ink-700">Default currency</span>
                <select
                  class="mt-2 h-11 w-full rounded-base border border-surface-line bg-surface-body px-4 text-[14px] focus:border-brand-600"
                >
                  <option>USD - US Dollar</option>
                  <option>BDT - Bangladeshi Taka</option>
                </select>
              </label>
              <label class="block">
                <span class="text-[14px] font-semibold text-ink-700">Payout schedule</span>
                <select
                  class="mt-2 h-11 w-full rounded-base border border-surface-line bg-surface-body px-4 text-[14px] focus:border-brand-600"
                >
                  <option>Weekly</option>
                  <option>Bi-weekly</option>
                  <option>Monthly</option>
                </select>
              </label>
            </div>
          </article>
        </section>
      </main>

      {{> footer}}
    </div>

    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>

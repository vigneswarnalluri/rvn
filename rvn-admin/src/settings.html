<!doctype html>
<html lang="en">
  {{> head title="Settings"}}
  <body data-page="settings" data-sidebar-open="false">
    {{> preloader}} {{> sidebar}}

    <div class="min-h-screen lg:pl-sidebar">
      {{> topbar}}

      <main class="px-4 py-6 lg:px-6 min-h-[calc(100vh-140px)]">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="mb-1 text-[13px] font-semibold uppercase text-brand-600">Configuration</p>
            <h1 class="text-[24px] font-semibold text-ink-900">Settings</h1>
            <p class="mt-1 text-[14px] text-ink-500">
              Configure store identity, fulfillment, and operational defaults.
            </p>
          </div>
          <button type="button"
            class="inline-flex h-11 items-center gap-2 rounded-base bg-brand-600 px-4 text-[14px] font-semibold text-white hover:bg-brand-700"
          >
            <i data-lucide="save" class="h-4 w-4"></i>
            Save Changes
          </button>
        </div>

        <section>
          <form class="rounded-card border border-surface-line bg-surface-card p-6 shadow-card">
            <div class="border-b border-surface-line pb-5">
              <h2 class="text-[20px] font-medium text-ink-900">Store Profile</h2>
              <p class="mt-1 text-[14px] text-ink-500">
                These details appear in invoices, notifications, and storefront metadata.
              </p>
            </div>

            <div class="mt-6 grid gap-5 md:grid-cols-2">
              <label class="block">
                <span class="text-[14px] font-semibold text-ink-700">Store name</span>
                <input
                  class="mt-2 h-11 w-full rounded-base border border-surface-line bg-surface-body px-4 text-[14px] focus:border-brand-600"
                  value="RVN Grocery"
                />
              </label>
              <label class="block">
                <span class="text-[14px] font-semibold text-ink-700">Support email</span>
                <input
                  class="mt-2 h-11 w-full rounded-base border border-surface-line bg-surface-body px-4 text-[14px] focus:border-brand-600"
                  type="email"
                  value="support@RVN.local"
                />
              </label>
              <label class="block">
                <span class="text-[14px] font-semibold text-ink-700">Default currency</span>
                <select
                  class="mt-2 h-11 w-full rounded-base border border-surface-line bg-surface-body px-4 text-[14px] focus:border-brand-600"
                >
                  <option>USD - US Dollar</option>
                  <option>BDT - Bangladeshi Taka</option>
                </select>
              </label>
              <label class="block">
                <span class="text-[14px] font-semibold text-ink-700">Timezone</span>
                <select
                  class="mt-2 h-11 w-full rounded-base border border-surface-line bg-surface-body px-4 text-[14px] focus:border-brand-600"
                >
                  <option>Asia/Dhaka</option>
                  <option>UTC</option>
                </select>
              </label>
            </div>

            <div class="mt-6 rounded-card border border-surface-line bg-surface-body p-4">
              <label class="flex items-start gap-3">
                <input
                  type="checkbox"
                  checked
                  class="mt-1 h-4 w-4 rounded border-surface-line text-brand-600 focus:ring-brand-600"
                />
                <span>
                  <span class="block text-[14px] font-semibold text-ink-900">Enable order alert emails</span>
                  <span class="mt-1 block text-[13px] text-ink-500"
                    >Send operational alerts when orders fail payment, stock, or fulfillment checks.</span
                  >
                </span>
              </label>
            </div>

            <div class="mt-6 flex flex-wrap justify-end gap-2">
              <button
                type="button"
                class="h-11 rounded-base border border-surface-line px-4 text-[14px] font-semibold text-ink-700 hover:bg-surface-muted"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="h-11 rounded-base bg-brand-600 px-4 text-[14px] font-semibold text-white hover:bg-brand-700"
              >
                Save Changes
              </button>
            </div>
          </form>
        </section>
      </main>

      {{> footer}}
    </div>

    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>

                                            <option>Furniture</option>
                                            <option>Electronics</option>
                                            <option>Beauty</option>
                                        </select>
                                    </div>

                                    <span class="cd-headline clip is-full-width">
                                        <span class="cd-words-wrapper">
                                            <b class="is-visible">Search for something...</b>
                                            <b class="is-hidden">Looking for something specific?</b>
                                            <b class="is-hidden">Explore what you need...</b>
                                        </span>
                                    </span>
                                </div>

                    <li class="rbt-access-box rbt-scroll-trigger fade_in animation-order-3 tooltips tooltip-distance-lg d-none d-lg-flex"

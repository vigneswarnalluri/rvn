<!-- Start notify Modal Area  -->
<div class="rbt-default-modal modal fade has-rbt-top-folder-shape" id="requestDemoModal" tabindex="-1"
    aria-hidden="true">
    <div class="modal-dialog xxs-size modal-dialog-centered">
        <div class="modal-content">

            <div class="rbt-folder-shape-right-portion">
                <svg xmlns="http://www.w3.org/2000/svg" width="85" height="90" viewBox="0 0 85 90" fill="none">
                    <path
                        d="M0 0H11.1844C14.5695 0 17.7971 1.42971 20.0716 3.93671L82.1927 72.4059C83.9992 74.397 84.9999 76.9893 84.9999 79.6778C84.9999 85.6547 85.0001 90 85.0001 90H0V0Z"
                        fill="white" />
                </svg>
            </div>

            <div class="modal-header">
                <button type="button" class="rbt-round-btn rbt-modal-dis-btn" data-bs-dismiss="modal"
                    aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="rbt-top-folder-shape-wrapper">
                <div class="rbt-bg-color-white rbt-content-trs-portion">
                    <div class="rbt-notify-modal-content">
                        <h2 class="rbt-title h5 rbt-text-bold mb--8">
                            <span class="mr--4"><i class="fa-regular fa-headset"></i></span>
                            Contact To Request a Demo
                        </h2>
                        <div class="rbt-info-wrapper d-flex mt--8 rbt-gap--12">
                            <div class="rbt-info-box rbt-notify-box w-100">
                                <p class="b1 mb--16">
                                    Want to be Call Back when this product Queries.
                                </p>

                                <!-- Start tabs content -->
                                <form>
                                    <div class="rbt-input-field-grp d-flex flex-column rbt-gap--8">
                                        <label class="rbt-field-label mb--0" for="req-demo_name">Your Name
                                        </label>
                                        <input class="rbt-input-field mb--20" type="text" placeholder="Your Name"
                                            id="req-demo_name">
                                        <label class="rbt-field-label mb--0" for="req-demo_email">Your Email
                                            <span class="rbt-text-color-danger">*</span>
                                        </label>
                                        <input class="rbt-input-field mb--20" type="email" placeholder="Email"
                                            id="req-demo_email">
                                        <label class="rbt-field-label mb--0" for="req-demo_title">Suggested Demo Name
                                            <span class="rbt-text-color-danger">*</span>
                                        </label>
                                        <input class="rbt-input-field mb--20" type="text" placeholder="Demo Name"
                                            id="req-demo_title">
                                        <label class="rbt-field-label mb--0" for="req-demo_category">Suggested Demo
                                            Category Name
                                        </label>
                                        <input class="rbt-input-field mb--20" type="text"
                                            placeholder="Demo Category Name" id="req-demo_category">
                                        <label class="rbt-field-label mb--0" for="req-demo_example-link">Example Link
                                            (Optional)
                                        </label>
                                        <input class="rbt-input-field mb--0" type="text" placeholder="example.abc"
                                            id="req-demo_example-link">
                                    </div>
                                    <button type="submit" class="rbt-btn d-block w-100 mt--24 ">
                                        Submit
                                    </button>
                                </form>
                                <!-- End tabs content -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- End notify Modal Area  -->

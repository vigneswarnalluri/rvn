<!-- Start notify Modal Area  -->
<div class="rbt-default-modal modal fade has-rbt-top-folder-shape" id="makecallModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog xxs-size modal-dialog-centered">
        <div class="modal-content">

            <div class="rbt-folder-shape-right-portion">
                <svg xmlns="http://www.w3.org/2000/svg" width="85" height="90" viewBox="0 0 85 90" fill="none">
                    <path
                        d="M0 0H11.1844C14.5695 0 17.7971 1.42971 20.0716 3.93671L82.1927 72.4059C83.9992 74.397 84.9999 76.9893 84.9999 79.6778C84.9999 85.6547 85.0001 90 85.0001 90H0V0Z"
                        fill="white" />
                </svg>
            </div>

            <div class="modal-header">
                <button type="button" class="rbt-round-btn rbt-modal-dis-btn" data-bs-dismiss="modal"
                    aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="rbt-top-folder-shape-wrapper">
                <div class="rbt-bg-color-white rbt-content-trs-portion">
                    <div class="rbt-notify-modal-content">
                        <h2 class="rbt-title h5 rbt-text-bold mb--8">
                            <span class="mr--4"><i class="fa-regular fa-headset"></i></span>
                            Contact To Know the Product Details
                        </h2>
                        <div class="rbt-info-wrapper d-flex mt--8 rbt-gap--12">
                            <div class="rbt-info-box rbt-notify-box w-100">
                                <p class="b1 mb--16">
                                    Want to be Call Back when this product Queries.
                                </p>

                                <div class="rbt-tab rbt-round-shape-tab">

                                    <!-- Start tabs -->
                                    <ul class="nav nav-tabs" id="callFormTab1" role="tablist">
                                        <li class="nav-item" role="presentation">
                                            <button class="nav-link active" id="rbt-tab-id-1" data-bs-toggle="tab"
                                                data-bs-target="#rbt-tab-call-pane-1" type="button" role="tab"
                                                aria-controls="rbt-tab-call-pane-1" aria-selected="true">
                                                <i class="fa-regular fa-phone-volume"></i>
                                                Make Instant Call
                                            </button>
                                        </li>
                                        <li class="nav-item" role="presentation">
                                            <button class="nav-link" id="rbt-tab-id-2" data-bs-toggle="tab"
                                                data-bs-target="#rbt-tab-call-pane-2" type="button" role="tab"
                                                aria-controls="rbt-tab-call-pane-2" aria-selected="false">
                                                <i class="fa-sharp fa-regular fa-phone-arrow-down-left"></i>
                                                Request Call Back
                                            </button>
                                        </li>
                                    </ul>
                                    <!-- End tabs -->

                                    <!-- Start tabs content -->
                                    <form>
                                        <div class="tab-content" id="callFormTab1Content">
                                            <div class="tab-pane fade show active" id="rbt-tab-call-pane-1"
                                                role="tabpanel" aria-labelledby="rbt-tab-id-1" tabindex="0">
                                                <div class="rbt-btn-grp flex-column rbt-gap--24">
                                                    <!-- Call via Phone -->
                                                    <a href="tel:+958445612564"
                                                        class="rbt-btn d-block w-100 text-center rbt-btn-modern-hover rbt-bg-color-phone tooltips"
                                                        data-tooltip="Call via Phone" data-tooltip-position="top">
                                                        <span class="icon"><i class="fa-regular fa-phone"></i></span>
                                                        +9584 4561 2564
                                                    </a>

                                                    <!-- Call via WhatsApp -->
                                                    <a href="https://wa.me/958445612564" target="_blank"
                                                        class="rbt-btn d-block w-100 text-center rbt-btn-modern-hover rbt-bg-color-whatsapp tooltips"
                                                        data-tooltip="Call via WhatsApp" data-tooltip-position="top">
                                                        <span class="icon"><i class="fa-brands fa-whatsapp"></i></span>
                                                        Call via WhatsApp
                                                    </a>

                                                    <!-- Call via Telegram -->
                                                    <a href="https://t.me/+958445612564" target="_blank"
                                                        class="rbt-btn d-block w-100 text-center rbt-btn-modern-hover rbt-bg-color-telegram tooltips"
                                                        data-tooltip="Call via Telegram" data-tooltip-position="top">
                                                        <span class="icon"><i class="fa-brands fa-telegram"></i></span>
                                                        Call via Telegram
                                                    </a>

                                                    <!-- Call via Signal -->
                                                    <a href="https://signal.me/#p/+958445612564" target="_blank"
                                                        class="rbt-btn d-block w-100 text-center rbt-btn-modern-hover rbt-bg-color-signal tooltips"
                                                        data-tooltip="Call via Signal" data-tooltip-position="top">
                                                        <span class="icon"><i class="fa-solid fa-messages"></i></span>
                                                        Call via Signal Messenger
                                                    </a>

                                                </div>
                                            </div>
                                            <div class="tab-pane fade" id="rbt-tab-call-pane-2" role="tabpanel"
                                                aria-labelledby="rbt-tab-id-2" tabindex="0">
                                                <div class="rbt-input-field-grp d-flex flex-column rbt-gap--8">
                                                    <div
                                                        class="rbt-modern-select rbt-modern-select-round-style country-num-select w-100">
                                                        <select class="rbt-select-activation">
                                                            <option>United States Of America</option>
                                                            <option>Bangladesh</option>
                                                            <option>United Kingdom</option>
                                                            <option>France</option>
                                                            <option>Spain</option>
                                                        </select>
                                                    </div>
                                                    <label class="rbt-field-label mb--0 ml--12"
                                                        for="req-call_email">Your Email
                                                        <span class="rbt-text-color-danger">*</span>
                                                    </label>
                                                    <input class="rbt-input-field" type="email" placeholder="Email"
                                                        id="req-call_email">
                                                    <label class="rbt-field-label mb--0 ml--12"
                                                        for="req-call-number">Your Phone Number
                                                        <span class="rbt-text-color-danger">*</span>
                                                    </label>
                                                    <input class="rbt-input-field" type="number"
                                                        placeholder="Phone Number" id="req-call-number">
                                                </div>
                                                <ul
                                                    class="rbt-signup-radio-list w-100 justify-content-around mt--16 mb--0 pl--12 pr--12">
                                                    <li class="rbt-check-grp ml--0">
                                                        <input id="rbt-callback-radio-1" type="radio"
                                                            name="rbt-signup-radio">
                                                        <label for="rbt-callback-radio-1">
                                                            <span class="rbt-lable-text">Call</span>
                                                        </label>
                                                    </li>
                                                    <li class="rbt-check-grp ml--0">
                                                        <input id="rbt-callback-radio-2" type="radio"
                                                            name="rbt-signup-radio">
                                                        <label for="rbt-callback-radio-2">
                                                            <span class="rbt-lable-text">SMS</span>
                                                        </label>
                                                    </li>
                                                    <li class="rbt-check-grp ml--0">
                                                        <input id="rbt-callback-radio-3" type="radio"
                                                            name="rbt-signup-radio">
                                                        <label for="rbt-callback-radio-3">
                                                            <span class="rbt-lable-text">Whatsapp</span>
                                                        </label>
                                                    </li>
                                                </ul>
                                                <button type="submit" class="rbt-btn d-block w-100 mt--24 ">
                                                    SEND
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                    <!-- End tabs content -->

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- End notify Modal Area  -->
